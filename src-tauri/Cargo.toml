[package]
name = "ipeenv"
version = "0.1.0"
description = "Ambiente local de desenvolvimento para Windows"
authors = ["Ipeenv"]
edition = "2021"

[lib]
name = "ipeenv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
tauri = { version = "2.9.1", features = ["tray-icon"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "2.4.2"
